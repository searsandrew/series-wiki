name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "^11.0"
            testbench: "^9.0"
            pest: "^3.0"
          - php: "8.2"
            laravel: "^12.0"
            testbench: "^10.0"
            pest: "^3.0"
          - php: "8.3"
            laravel: "^13.0"
            testbench: "^11.0"
            pest: "^4.0"
          - php: "8.4"
            laravel: "^13.0"
            testbench: "^11.0"
            pest: "^4.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          composer config platform.php ${{ matrix.php }}.0
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest }}" --no-update --no-interaction
          # Laravel 11 is EOL; this exception applies only to isolated legacy compatibility tests.
          if [ "${{ matrix.laravel }}" = "^11.0" ]; then
            composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --no-security-blocking
          else
            composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist
          fi

      - name: Run tests
        run: ./vendor/bin/pest
